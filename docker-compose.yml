services:

  server:
    container_name: server
    build: .
    restart: always
    working_dir: /app
    depends_on:
      - postgres
    ports:
      - 8080:8080
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecommerce

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ecommerce

volumes:
  pg_data:

networks:
  ecommerce:
    external: true
    name: ecommerce
